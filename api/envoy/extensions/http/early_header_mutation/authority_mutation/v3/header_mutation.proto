syntax = "proto3";

package envoy.extensions.http.early_header_mutation.authority_mutation.v3;

import "udpa/annotations/status.proto";
import "validate/validate.proto";

option java_package = "io.envoyproxy.envoy.extensions.http.early_header_mutation.authority_mutation.v3";
option java_outer_classname = "AuthorityMutationProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/extensions/http/early_header_mutation/authority_mutation/v3;authority_mutationv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

// [#protodoc-title: Default early header mutation extension]
// [#extension: envoy.http.early_header_mutation.authority_mutation]

// This extension allows for early authority (host header) mutation.
message AuthorityMutation {
  // A literal value to copy the authority value from.
  // If the `header`
  string literal = 1;

  // The name of a header to copy the authority value from.
  // If the header is missing, no substitution is performed.
  // Takes precedence over the `literal` value if defined.
  string header = 2 [
    (validate.rules).string = {well_known_regex: HTTP_HEADER_NAME strict: false ignore_empty: true}
  ];

  // If true, the literal value will be used as a fallback if the header name is missing.
  bool use_literal_fallback = 3;
}
